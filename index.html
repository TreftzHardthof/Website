<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Der Specht</title>

  <style>
    :root {
      --paper: #f7f5ef;
      --ink: #29382f;
      --green: #647b55;
      --green-light: #a9b59a;
      --red: #c95743;
      --cream: #e7d6b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      width: min(1400px, 100%);
      margin: auto;
      padding: clamp(28px, 6vw, 88px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: clamp(32px, 6vw, 100px);
    }

    .poem {
      max-width: 650px;
      font-size: clamp(2.5rem, 5.3vw, 5.8rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.065em;
    }

    .poem span {
      display: block;
    }

    .poem span:last-child {
      color: var(--red);
    }

    .illustration {
      position: relative;
      width: 100%;
      max-width: 560px;
      margin-inline: auto;
      align-self: stretch;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70svh;
      overflow: visible;
    }

    /* Äußere Gruppe: Schwanken und Fallbewegung */
.bird-fall {
  transform-box: view-box;
  transform-origin: 0 0;
  translate: 0 -35px;

  animation:
    sway 1.8s ease-in-out 0s 2 alternate,
    sway 1.8s ease-in-out 3.6s 1 alternate,
    fall 1.5s cubic-bezier(.55, 0, .85, .35) 5s forwards;
}

/* Innere Gruppe: sichtbarer Überschlag */
.bird {
  transform-box: view-box;
  transform-origin: 320px 235px;
  animation: tumble 1.5s ease-in 5s forwards;
}

/* Ruhiges Schwanken vor dem Absturz */
@keyframes sway {
  0%   { transform: translate(0, 0) rotate(0deg); }
  25%  { transform: translate(-1px, 1px) rotate(-1deg); }
  50%  { transform: translate(1px, -1px) rotate(0.5deg); }
  75%  { transform: translate(1px, 1px) rotate(1deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}

/* Nach unten fallen – positive Y-Werte zeigen nach unten */
@keyframes fall {
  0%   { transform: translate(0, 0); }
  35%  { transform: translate(0, 30px); }
  70%  { transform: translate(0, 175px); }
  88%  { transform: translate(0, 260px); }
  100% { transform: translate(0, 280px); }
}

/* Erst taumeln, dann kopfüber landen */
@keyframes tumble {
  0%   { transform: rotate(0deg); }
  20%  { transform: rotate(55deg); }
  45%  { transform: rotate(200deg); }
  70%  { transform: rotate(315deg); }
  88%  { transform: rotate(430deg); }
  100% { transform: rotate(490deg); }
}

@media (prefers-reduced-motion: reduce) {
  .bird-fall,
  .bird {
    animation: none;
  }
}

    .ground {
      stroke: var(--ink);
      stroke-width: 2;
      stroke-linecap: round;
    }

    footer {
      padding: 20px clamp(28px, 6vw, 88px);
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    @media (max-width: 700px) {
      main {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 44px 26px 20px;
        align-content: center;
      }

      .poem {
        font-size: clamp(2.5rem, 10vw, 4.4rem);
      }

      .illustration {
        min-height: 260px;
        max-height: 42svh;
      }

      svg {
        max-height: 42svh;
        width: min(100%, 420px);
      }

      footer {
        padding: 16px 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bird {
        animation-duration: 0.01ms;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="poem" aria-label="Ein kleines Spechtgedicht">
      <span>Auf dem Baum</span>
      <span>da sitzt ein Specht,</span>
      <span>der Baum ist hoch,</span>
      <span>dem Specht ist schlecht.</span>

            <path d="M164 292 l-24 -19 M164 292 l-31 -4

        <!-- Boden -->
        <path

        <!-- Kleine Gräser -->
        <g

          stroke-width="2"

          fill="none"
        >
          <path d="M77 448 l-6 -12 M77 448 l5 -10
                   M355 448 l-5 -14 M355 448 l9 -9"/>
        </g>

        <!-- Buntspecht als Inline-SVG-Gruppe -->
        <g class="bird-fall">
  <g class="bird" stroke="#29382f"
     stroke-width="2.5" stroke-linejoin="round">

          <!-- Schwanz -->
          <path
            d="M307 248 L337 270 L324 239 Z"
            fill="#29382f"
          />
          <path
            d="M312 246 L330 262"
            stroke="#f7f5ef"

          />

          <path

               C334 240 316 259 296 255

          <!-- Weiße Schulterpartie -->
          <path

          <!-- Kopf -->
          <path

          />

          <!-- Rote Kopfpartie -->
          <path

          />

          <!-- Wange -->
          <path

            stroke="none"
          />

          <!-- Schnabel -->
          <path
            d="M262 184 L243 190 L262 192 Z"

          />

          <!-- Auge -->
          <circle cx="272" cy="181" r="2.8" fill="#f7f5ef"
                  stroke="none"/>

          <!-- Flügel -->
          <path
            d="M293 211
               Q316 211 316 231
               Q307 244 292 236
               L284 225 Z"

          />
          <path
            d="M292 219 L305 230 M289 225 L300 237"
            stroke="#f7f5ef"

          />

          <!-- Füße -->
          <path
            d="M294 252 L290 261 L283 261
               M290 257 L296 261
               M312 250 L310 259 L304 260
               M310 256 L316 259"
            fill="none"
            stroke="#b49a73"
            stroke-width="3"
            stroke-linecap="round"
          />
        </g>
		</g>

        <!-- Kleine dekorative Punkte -->
        <circle cx="86" cy="116" r="3" fill="#c95743"/>
        <circle cx="105" cy="132" r="2" fill="#647b55"/>
        <circle cx="365" cy="168" r="3" fill="#647b55"/>
      </svg>
    </div>
  </main>

  <footer>Bist Du hier falsch? Vermutlich!</footer>
</body>
</html>
